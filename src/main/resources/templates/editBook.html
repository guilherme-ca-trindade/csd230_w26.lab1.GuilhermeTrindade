<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>
</head>
<body>
<h1>Edit Book</h1>

<form action="#" th:action="@{/books/edit/{id}(id=${book.id})}" th:object="${book}" method="post">
    <!-- the id is already in the URL, this keeps it in the bound object too -->
    <input type="hidden" th:field="*{id}" />

    <label>Title: <input type="text" th:field="*{title}" required /></label><br/><br/>
    <label>Author: <input type="text" th:field="*{author}" required /></label><br/><br/>
    <label>Price: <input type="number" step="0.01" min="0" th:field="*{price}" required /></label><br/><br/>
    <label>Copies: <input type="number" min="0" th:field="*{copies}" required /></label><br/><br/>

    <button type="submit">Update Book</button>
</form>

<br/>
<a th:href="@{/books}">Back to List</a>
</body>
</html>
