<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Details</title>
</head>
<body>
<h1>Book Details</h1>

<!-- the controller puts null in the model when the book is not found -->
<div th:if="${book}">
    <p><strong>ID:</strong> <span th:text="${book.id}"></span></p>
    <p><strong>Title:</strong> <span th:text="${book.title}"></span></p>
    <p><strong>Author:</strong> <span th:text="${book.author}"></span></p>
    <p><strong>ISBN:</strong> <span th:text="${book.isbn}"></span></p>
    <p><strong>Price:</strong> <span th:text="'$' + ${#numbers.formatDecimal(book.price, 1, 2)}"></span></p>
    <p><strong>Copies:</strong> <span th:text="${book.copies}"></span></p>

    <p><a th:href="@{/cart/add/{id}(id=${book.id})}">Add to Cart</a></p>
</div>
<div th:unless="${book}">
    <p>No book found.</p>
</div>

<a th:href="@{/books}">Back to List</a>
</body>
</html>
