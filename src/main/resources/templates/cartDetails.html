<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shopping Cart</title>
</head>
<body>
<h1>Your Shopping Cart</h1>

<p th:if="${message}" th:text="${message}" style="color: green;"></p>
<p th:if="${error}" th:text="${error}" style="color: red;"></p>

<div th:if="${cart.products.empty}">
    <p>Your cart is empty.</p>
</div>

<table border="1" th:unless="${cart.products.empty}">
    <thead>
    <tr>
        <th>Item Name / Description</th>
        <th>Type</th>
        <th>Price</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <!-- The cart holds Set<ProductEntity>, so books and tickets come through mixed and
         they do not keep their name in the same field. T(...) names a Java class. -->
    <tr th:each="product : ${cart.products}">
        <td>
            <!-- books, magazines and disc mags inherit 'title' -->
            <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                  th:text="${product.title}"></span>

            <!-- a ticket has a description instead -->
            <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                  th:text="${product.description}"></span>
        </td>

        <!-- getProductType() from Lecture 2.5.1 step 2.1 -->
        <td th:text="${product.productType}"></td>

        <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></td>
        <td>
            <a th:href="@{/cart/remove/{id}(id=${product.id})}">Remove</a>
        </td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <!-- the controller summed this, the view just prints it -->
        <th colspan="2">Total</th>
        <th th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}"></th>
        <th></th>
    </tr>
    </tfoot>
</table>

<!-- Lab 2: a form and not a link, because checking out changes data. A link is a GET
     and browsers can pre-fetch or replay a GET, charging the customer twice. -->
<div th:unless="${cart.products.empty}">
    <form th:action="@{/cart/checkout}" method="post">
        <button type="submit">Checkout</button>
    </form>
</div>

<br/>
<p>
    <a th:href="@{/books}">Continue Shopping</a>
</p>
</body>
</html>
