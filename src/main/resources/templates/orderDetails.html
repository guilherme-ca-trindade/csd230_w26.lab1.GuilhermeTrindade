<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Confirmation</title>
</head>
<body>
<h1>Order Confirmation</h1>

<div th:if="${order}">
    <p style="color: green;"><strong>Thank you! Your order has been placed.</strong></p>

    <!-- out of stock warning from the checkout method -->
    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
    <!-- without #temporals this prints the raw 2026-10-04T21:13:55.482 -->
    <p><strong>Order Date:</strong>
        <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    <p><strong>Items Purchased:</strong> <span th:text="${order.itemCount}"></span></p>
    <p><strong>Total Amount Paid:</strong>
        <span th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></p>

    <h2>Items</h2>
    <table border="1">
        <thead>
        <tr>
            <th>Item Name / Description</th>
            <th>Type</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
        <!-- same mixed rows as the cart -->
        <tr th:each="product : ${order.products}">
            <td>
                <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                      th:text="${product.title}"></span>
                <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                      th:text="${product.description}"></span>
            </td>
            <td th:text="${product.productType}"></td>
            <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2">Total</th>
            <th th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></th>
        </tr>
        </tfoot>
    </table>
</div>

<div th:unless="${order}">
    <p>No order found.</p>
</div>

<br/>
<p>
    <a th:href="@{/books}">Back to Book List</a> |
    <a th:href="@{/cart}">View Cart</a>
</p>
</body>
</html>
