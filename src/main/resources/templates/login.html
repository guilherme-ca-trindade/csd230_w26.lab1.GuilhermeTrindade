<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>
<h1>Please Sign In</h1>

<!-- Spring Security redirects back here with ?error or ?logout in the query string -->
<div th:if="${param.error}" style="color:red">
    Invalid username or password.
</div>
<div th:if="${param.logout}" style="color:green">
    You have been logged out.
</div>
<!-- Lab 3: RegisterController sends them here after a successful sign-up -->
<div th:if="${param.registered}" style="color:green">
    Account created. Please sign in.
</div>

<!-- th:action adds the hidden CSRF token, a plain action="/login" would be rejected -->
<form th:action="@{/login}" method="post">
    <div>
        <label>Username: <input type="text" name="username" autofocus="autofocus"/></label>
    </div>
    <div>
        <label>Password: <input type="password" name="password"/></label>
    </div>
    <div>
        <input type="submit" value="Sign In"/>
    </div>
</form>

<p>New user? <a th:href="@{/register}">Register here</a></p>
</body>
</html>
