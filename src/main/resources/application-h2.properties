# Run on an in-memory H2 database instead of Docker/MySQL:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# The default profile is still mysql (see application.properties).
spring.datasource.url=jdbc:h2:mem:csd230;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# in-memory, so the schema is built from the entities every start
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# tables at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:csd230)
spring.h2.console.enabled=true
