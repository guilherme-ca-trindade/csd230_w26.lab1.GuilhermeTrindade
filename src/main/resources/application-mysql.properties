# MySQL container from docker-compose.yaml (host port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/csd230
spring.datasource.username=root
spring.datasource.password=itstudies12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate drops and recreates the schema on every start
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
